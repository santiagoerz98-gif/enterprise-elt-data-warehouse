version: 2

models:
  - name: dim_customers
    description: "Customer dimension sourced from the Silver layer."
    columns:
      - name: customer_id
        description: "Customer business key."
        tests:
          - not_null
          - unique
      - name: company_name
        tests:
          - not_null
      - name: customer_address
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: customer_market_type
        tests:
          - not_null
          - accepted_values:
              values: ["Domestic", "International"]

  - name: dim_employees
    description: "Employee dimension sourced from the Silver layer."
    columns:
      - name: employee_id
        description: "Employee business key."
        tests:
          - not_null
          - unique
      - name: full_name
        tests:
          - not_null
      - name: hire_date
        tests:
          - not_null
      - name: manager_id
        description: "Direct manager employee identifier."
        tests:
          - relationships:
              to: ref('dim_employees')
              field: employee_id
      - name: manager_full_name
        tests:
          - not_null
      - name: manager_title
        tests:
          - not_null
      - name: direct_reports
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: dim_products
    description: "Product dimension sourced from the Silver layer."
    columns:
      - name: product_id
        description: "Product business key."
        tests:
          - not_null
          - unique
      - name: category_id
        tests:
          - not_null
      - name: supplier_id
        tests:
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: units_in_stock
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: units_on_order
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: reorder_level
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: is_discontinued
        tests:
          - not_null
      - name: is_out_of_stock
        tests:
          - not_null
      - name: needs_reorder
        tests:
          - not_null

  - name: dim_time
    description: "Daily calendar dimension generated from order dates."
    columns:
      - name: date_key
        description: "Date identifier in YYYYMMDD format."
        tests:
          - not_null
          - unique
      - name: date_day
        description: "Calendar date."
        tests:
          - not_null
          - unique
      - name: year
        tests:
          - not_null
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: month_number
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 12
      - name: week_number
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 53
      - name: day_of_week_number
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 7
      - name: is_weekend
        tests:
          - not_null

  - name: fact_sales
    description: "Sales fact table at the order and product line level."
    columns:
      - name: sales_id
        description: "Surrogate key for each order-product line."
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: employee_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_employees')
              field: employee_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: date_day
      - name: required_date
        tests:
          - relationships:
              to: ref('dim_time')
              field: date_day
      - name: shipped_date
        tests:
          - relationships:
              to: ref('dim_time')
              field: date_day
      - name: shipping_status
        tests:
          - not_null
          - accepted_values:
              values: ["Pending", "Delayed", "On Time"]
      - name: freight
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: quantity_sold
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: actual_unit_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: discount_pct
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: net_revenue
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: price_status
        tests:
          - not_null
          - accepted_values:
              values: ["Above Catalog", "Below Catalog", "At Catalog"]
