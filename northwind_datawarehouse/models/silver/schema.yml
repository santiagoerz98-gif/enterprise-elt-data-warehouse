version: 2

models:
  - name: silver_customers
    description: "Cleaned and enriched customer data from the bronze layer."
    columns:
      - name: customer_id
        description: "Primary key for the customer."
        tests:
          - not_null
          - unique
      - name: company_name
        description: "Customer company name."
        tests:
          - not_null
      - name: contact_name
        description: "Customer contact name."
      - name: contact_title
        description: "Customer contact title."
      - name: contact_role_category
        description: "Contact role category."
        tests:
          - accepted_values:
              values: ["Executive", "Manager", "Sales", "Other"]
      - name: customer_address
        description: "Customer street address."
        tests:
          - not_null
      - name: city
        description: "Customer city."
        tests:
          - not_null
      - name: region
        description: "Customer region."
      - name: postal_code
        description: "Customer postal code."
      - name: country
        description: "Customer country."
      - name: customer_market_type
        description: "Customer market classification."
        tests:
          - accepted_values:
              values: ["Domestic", "International"]

  - name: silver_orders
    description: "Cleaned and enriched order data from the bronze layer."
    columns:
      - name: order_id
        description: "Primary key for the order."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Customer who placed the order."
        tests:
          - not_null
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: employee_id
        description: "Employee responsible for the order."
        tests:
          - not_null
          - relationships:
              to: ref('silver_employees')
              field: employee_id
      - name: order_date
        description: "Order creation date."
        tests:
          - not_null
      - name: required_date
        description: "Date on which the order is required."
      - name: shipped_date
        description: "Date on which the order was shipped."
      - name: customer_address
        description: "Customer address at the time of the order."
      - name: customer_city
        description: "Customer city."
      - name: customer_country
        description: "Customer country."
      - name: ship_address
        description: "Shipping address."
      - name: ship_city
        description: "Shipping city."
      - name: ship_country
        description: "Shipping country."
      - name: is_different_shipping_address
        description: "Indicates whether the shipping address differs from the customer address."
        tests:
          - not_null
      - name: shipping_status
        description: "Order shipping status."
        tests:
          - not_null
          - accepted_values:
              values: ["Pending", "Delayed", "On Time"]
      - name: freight
        description: "Order freight cost."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: silver_employees
    description: "Cleaned and enriched employee data from the bronze layer."
    columns:
      - name: employee_id
        description: "Primary key for the employee."
        tests:
          - not_null
          - unique
      - name: full_name
        description: "Employee full name."
        tests:
          - not_null
      - name: title
        description: "Employee job title."
      - name: birth_date
        description: "Employee birth date."
      - name: hire_date
        description: "Employee hire date."
        tests:
          - not_null
      - name: employee_address
        description: "Employee street address."
      - name: city
        description: "Employee city."
      - name: region
        description: "Employee region."
      - name: country
        description: "Employee country."
      - name: postal_code
        description: "Employee postal code."
      - name: manager_id
        description: "Employee manager identifier."
        tests:
          - relationships:
              to: ref('silver_employees')
              field: employee_id
      - name: manager_full_name
        description: "Employee manager full name."
        tests:
          - not_null
      - name: manager_title
        description: "Employee manager title."
        tests:
          - not_null
      - name: direct_reports
        description: "Number of employees directly reporting to this employee."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: silver_orders_details
    description: "Cleaned and enriched order line item data."
    columns:
      - name: order_id
        description: "Order identifier."
        tests:
          - not_null
          - relationships:
              to: ref('silver_orders')
              field: order_id
      - name: product_id
        description: "Product identifier."
        tests:
          - not_null
          - relationships:
              to: ref('silver_products')
              field: product_id
      - name: actual_unit_price
        description: "Unit price charged in the order."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: catalog_unit_price
        description: "Current catalog unit price."
      - name: quantity
        description: "Quantity ordered."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: discount_pct
        description: "Discount applied to the order line."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: net_revenue
        description: "Revenue after applying the discount."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: unit_price_diff
        description: "Difference between actual and catalog unit prices."
      - name: revenue_impact
        description: "Revenue impact caused by the unit price difference."
      - name: price_status
        description: "Actual price compared with the catalog price."
        tests:
          - not_null
          - accepted_values:
              values: ["Above Catalog", "Below Catalog", "At Catalog"]

  - name: silver_products
    description: "Cleaned and enriched product data."
    columns:
      - name: product_id
        description: "Primary key for the product."
        tests:
          - not_null
          - unique
      - name: category_id
        description: "Product category identifier."
        tests:
          - not_null
          - relationships:
              to: ref('bronze_categories')
              field: category_id
      - name: supplier_id
        description: "Product supplier identifier."
        tests:
          - not_null
          - relationships:
              to: ref('bronze_suppliers')
              field: supplier_id
      - name: product_name
        description: "Product name."
        tests:
          - not_null
      - name: quantity_per_unit
        description: "Product quantity description."
      - name: category_name
        description: "Product category name."
      - name: category_description
        description: "Product category description."
      - name: supplier_name
        description: "Supplier company name."
      - name: supplier_country
        description: "Supplier country."
      - name: unit_price
        description: "Product unit price."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: units_in_stock
        description: "Units currently in stock."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: units_on_order
        description: "Units currently on order."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: reorder_level
        description: "Stock level that triggers replenishment."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: is_discontinued
        description: "Indicates whether the product is discontinued."
        tests:
          - not_null
      - name: is_out_of_stock
        description: "Indicates whether the product is out of stock."
        tests:
          - not_null
      - name: needs_reorder
        description: "Indicates whether the product needs replenishment."
        tests:
          - not_null
