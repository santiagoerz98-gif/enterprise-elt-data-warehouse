version: 2

models:
  - name: silver_customers
    description: "Cleaned and enriched customer data from the bronze layer."
    columns:
      - name: customer_id
        description: "{{ doc('customer_id_description') }}"
        tests:
          - not_null
          - unique

      - name: company_name
        description: "{{ doc('company_name_description') }}"
        tests:
          - not_null

      - name: contact_name
        description: "{{ doc('contact_name_description') }}"

      - name: contact_title
        description: "{{ doc('contact_title_description') }}"

      - name: contact_role_category
        description: "{{ doc('contact_role_category_description') }}"
        tests:
          - accepted_values:
              values: ["Executive", "Manager", "Sales", "Other"]

      - name: customer_address
        description: "{{ doc('customer_address_description') }}"
        tests:
          - not_null

      - name: city
        description: "{{ doc('city_description') }}"
        tests:
          - not_null

      - name: region
        description: "{{ doc('region_description') }}"

      - name: postal_code
        description: "{{ doc('postal_code_description') }}"

      - name: country
        description: "{{ doc('country_description') }}"

      - name: customer_market_type
        description: "{{ doc('customer_market_type_description') }}"
        tests:
          - accepted_values:
              values: ["Domestic", "International"]

  - name: silver_orders
    description: "Cleaned and enriched order data from the bronze layer."
    columns:
      - name: order_id
        description: "{{ doc('order_id_description') }}"
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "{{ doc('customer_id_description') }}"
        tests:
          - not_null
          - relationships:
              to: ref('silver_customers')
              field: customer_id

      - name: employee_id
        description: "{{ doc('employee_id_description') }}"
        tests:
          - not_null
          - relationships:
              to: ref('silver_employees')
              field: employee_id

      - name: order_date
        description: "{{ doc('order_date_description') }}"
        tests:
          - not_null

      - name: required_date
        description: "{{ doc('required_date_description') }}"

      - name: shipped_date
        description: "{{ doc('shipped_date_description') }}"

      - name: customer_address
        description: "{{ doc('customer_address_description') }}"

      - name: customer_city
        description: "{{ doc('customer_city_description') }}"

      - name: customer_country
        description: "{{ doc('customer_country_description') }}"

      - name: ship_address
        description: "{{ doc('ship_address_description') }}"

      - name: ship_city
        description: "{{ doc('ship_city_description') }}"

      - name: ship_country
        description: "{{ doc('ship_country_description') }}"

      - name: is_different_shipping_address
        description: "{{ doc('is_different_shipping_address_description') }}"
        tests:
          - not_null

      - name: shipping_status
        description: "{{ doc('shipping_status_description') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["Pending", "Delayed", "On Time"]

      - name: freight
        description: "{{ doc('freight_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: silver_employees
    description: "Cleaned and enriched employee data from the bronze layer."
    columns:
      - name: employee_id
        description: "{{ doc('employee_id_description') }}"
        tests:
          - not_null
          - unique

      - name: full_name
        description: "{{ doc('full_name_description') }}"
        tests:
          - not_null

      - name: title
        description: "{{ doc('title_description') }}"

      - name: birth_date
        description: "{{ doc('birth_date_description') }}"

      - name: hire_date
        description: "{{ doc('hire_date_description') }}"
        tests:
          - not_null

      - name: employee_address
        description: "{{ doc('employee_address_description') }}"

      - name: city
        description: "{{ doc('city_description') }}"

      - name: region
        description: "{{ doc('region_description') }}"

      - name: country
        description: "{{ doc('country_description') }}"

      - name: postal_code
        description: "{{ doc('postal_code_description') }}"

      - name: manager_id
        description: "{{ doc('manager_id_description') }}"
        tests:
          - relationships:
              to: ref('silver_employees')
              field: employee_id

      - name: manager_full_name
        description: "{{ doc('manager_full_name_description') }}"
        tests:
          - not_null

      - name: manager_title
        description: "{{ doc('manager_title_description') }}"
        tests:
          - not_null

      - name: direct_reports
        description: "{{ doc('direct_reports_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: silver_orders_details
    description: "Cleaned and enriched order line item data."
    columns:
      - name: order_id
        description: "{{ doc('order_id_description') }}"
        tests:
          - not_null
          - relationships:
              to: ref('silver_orders')
              field: order_id

      - name: product_id
        description: "{{ doc('product_id_description') }}"
        tests:
          - not_null
          - relationships:
              to: ref('silver_products')
              field: product_id

      - name: actual_unit_price
        description: "{{ doc('actual_unit_price_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: catalog_unit_price
        description: "{{ doc('catalog_unit_price_description') }}"

      - name: quantity_sold
        description: "{{ doc('quantity_sold_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

      - name: discount_pct
        description: "{{ doc('discount_pct_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

      - name: net_revenue
        description: "{{ doc('net_revenue_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: unit_price_diff
        description: "{{ doc('unit_price_diff_description') }}"

      - name: revenue_impact
        description: "{{ doc('revenue_impact_description') }}"

      - name: price_status
        description: "{{ doc('price_status_description') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["Above Catalog", "Below Catalog", "At Catalog"]

  - name: silver_products
    description: "Cleaned and enriched product data."
    columns:
      - name: product_id
        description: "{{ doc('product_id_description') }}"
        tests:
          - not_null
          - unique

      - name: category_id
        description: "{{ doc('category_id_description') }}"
        tests:
          - not_null
          - relationships:
              to: ref('bronze_categories')
              field: category_id

      - name: supplier_id
        description: "{{ doc('supplier_id_description') }}"
        tests:
          - not_null
          - relationships:
              to: ref('bronze_suppliers')
              field: supplier_id

      - name: product_name
        description: "{{ doc('product_name_description') }}"
        tests:
          - not_null

      - name: quantity_per_unit
        description: "{{ doc('quantity_per_unit_description') }}"

      - name: category_name
        description: "{{ doc('category_name_description') }}"

      - name: category_description
        description: "{{ doc('category_description_description') }}"

      - name: supplier_name
        description: "{{ doc('supplier_name_description') }}"

      - name: supplier_country
        description: "{{ doc('supplier_country_description') }}"

      - name: unit_price
        description: "{{ doc('unit_price_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: units_in_stock
        description: "{{ doc('units_in_stock_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: units_on_order
        description: "{{ doc('units_on_order_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: reorder_level
        description: "{{ doc('reorder_level_description') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: is_discontinued
        description: "{{ doc('is_discontinued_description') }}"
        tests:
          - not_null

      - name: is_out_of_stock
        description: "{{ doc('is_out_of_stock_description') }}"
        tests:
          - not_null

      - name: needs_reorder
        description: "{{ doc('needs_reorder_description') }}"
        tests:
          - not_null
